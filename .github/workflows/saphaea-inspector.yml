name: Build Saphaea Inspector v0.3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Saphaea v0.3 source bundle
        uses: actions/checkout@v4
        with:
          ref: saphaea-v03-build

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rehydrate Saphaea v0.3 source
        shell: pwsh
        run: |
          $parts = @(
            ".github\saphaea-v03\source.part00",
            ".github\saphaea-v03\source.part01",
            ".github\saphaea-v03\source.part02",
            ".github\saphaea-v03\source.partA",
            ".github\saphaea-v03\source.partB",
            ".github\saphaea-v03\source.partC"
          )
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          if ($b64.Length -ne 61144) {
            throw "Unexpected Saphaea v0.3 source payload length: $($b64.Length)"
          }
          $zip = "$env:RUNNER_TEMP\saphaea-v03.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $dest = "$env:GITHUB_WORKSPACE\saphaea-inspector-v03"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xf $zip -C $dest

      - name: Restore
        shell: pwsh
        run: dotnet restore .\saphaea-inspector-v03\Saphaea.Inspector.csproj

      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: dotnet publish .\saphaea-inspector-v03\Saphaea.Inspector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\dist

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Saphaea installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\installer-dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\saphaea-inspector-v03\installer\SaphaeaInspector.iss

      - name: Package portable release
        shell: pwsh
        run: |
          Copy-Item .\saphaea-inspector-v03\README.md .\dist\README.txt
          New-Item -ItemType Directory -Force -Path .\dist\docs | Out-Null
          Copy-Item .\saphaea-inspector-v03\docs\*.md .\dist\docs\
          Compress-Archive -Path .\dist\* -DestinationPath .\Saphaea-Inspector-0.3-win-x64-portable.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.3-Setup
          path: installer-dist/Saphaea-Inspector-0.3-Setup.exe
          if-no-files-found: error

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.3-win-x64
          path: |
            dist/Saphaea Inspector.exe
            dist/README.txt
            dist/docs
            Saphaea-Inspector-0.3-win-x64-portable.zip
          if-no-files-found: error
