name: Build Saphaea Inspector v0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rehydrate Saphaea v0.2 source
        shell: pwsh
        run: |
          $b64 = @'
          
          '@
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\saphaea-v02.zip", [Convert]::FromBase64String($b64.Trim()))
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\saphaea-inspector-v02" | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\saphaea-v02.zip" -DestinationPath "$env:GITHUB_WORKSPACE\saphaea-inspector-v02" -Force

      - name: Restore
        shell: pwsh
        run: dotnet restore .\saphaea-inspector-v02\Saphaea.Inspector.csproj

      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: dotnet publish .\saphaea-inspector-v02\Saphaea.Inspector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\dist

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Saphaea installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\installer-dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\saphaea-inspector-v02\installer\SaphaeaInspector.iss

      - name: Package portable release
        shell: pwsh
        run: |
          Copy-Item .\saphaea-inspector-v02\README.md .\dist\README.txt
          Compress-Archive -Path .\dist\* -DestinationPath .\Saphaea-Inspector-0.2-win-x64-portable.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.2-Setup
          path: installer-dist/Saphaea-Inspector-0.2-Setup.exe
          if-no-files-found: error

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.2-win-x64
          path: |
            dist/Saphaea Inspector.exe
            dist/README.txt
            Saphaea-Inspector-0.2-win-x64-portable.zip
          if-no-files-found: error
