name: Build Saphaea Inspector

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rehydrate Saphaea source
        shell: pwsh
        run: |
          $b64 = @'
          
          '@
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\saphaea.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\saphaea-inspector" | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\saphaea.zip" -DestinationPath "$env:GITHUB_WORKSPACE\saphaea-inspector" -Force
          (Get-Content "$env:GITHUB_WORKSPACE\saphaea-inspector\MainWindow.xaml" -Raw) -replace ' CharacterSpacing="[^"]*"', '' | Set-Content "$env:GITHUB_WORKSPACE\saphaea-inspector\MainWindow.xaml"
          $proxyFile = "$env:GITHUB_WORKSPACE\saphaea-inspector\Services\ProxyService.cs"
          $proxySource = Get-Content $proxyFile -Raw
          Set-Content $proxyFile ("using System.IO;`r`nusing System.Net.Http;`r`n" + $proxySource)

      - name: Restore
        shell: pwsh
        run: dotnet restore .\saphaea-inspector\Saphaea.Inspector.csproj

      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: dotnet publish .\saphaea-inspector\Saphaea.Inspector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\dist

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item .\saphaea-inspector\README.md .\dist\README.txt
          Compress-Archive -Path .\dist\* -DestinationPath .\Saphaea-Inspector-0.1-win-x64.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.1-win-x64
          path: |
            dist/Saphaea Inspector.exe
            dist/*.dll
            dist/README.txt
          if-no-files-found: error

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Saphaea-Inspector-0.1-release
          path: Saphaea-Inspector-0.1-win-x64.zip
          if-no-files-found: error
