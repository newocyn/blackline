name: Build PCG OPSEC APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "opsec/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-opsec.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build PCG OPSEC debug APK
        run: gradle :opsec:assembleDebug
      - name: Rename APK
        run: cp opsec/build/outputs/apk/debug/opsec-debug.apk PCG-OPSEC-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCG-OPSEC-APK
          path: PCG-OPSEC-v1.0.apk
          if-no-files-found: error
