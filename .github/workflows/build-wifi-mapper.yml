name: Build PCG Network Tool Enterprise APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "wifi_mapper/**"
      - ".github/workflows/build-wifi-mapper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct PCG Network Tool source
        run: |
          cat wifi_mapper/srcgen/mainactivity.*.gz.b64part | base64 -d | gunzip > wifi_mapper/src/main/java/online/pcguys/wifimapper/MainActivity.kt
      - name: Build Network Tool debug APK
        run: gradle :wifi_mapper:assembleDebug
      - name: Rename APK
        run: cp wifi_mapper/build/outputs/apk/debug/wifi_mapper-debug.apk PCG-Network-Tool-Enterprise-v2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCG-Network-Tool-Enterprise-APK
          path: PCG-Network-Tool-Enterprise-v2.0.0.apk
          if-no-files-found: error
