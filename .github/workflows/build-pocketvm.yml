name: Build PCG PocketVM APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pocketvm/**'
      - '.github/workflows/build-pocketvm.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: gradle :pocketvm:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PCG-PocketVM-APK
          path: pocketvm/build/outputs/apk/debug/pocketvm-debug.apk
