name: Build Recall v1.0.1

on:
  push:
    branches: ["agent/recall-v1"]
    paths:
      - ".github/workflows/build-recall-v101.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified base APK and apktool
        run: |
          curl -L --fail --retry 3 -o base.apk https://github.com/Alfio010/notification-listener-android/releases/download/v2.7.3/notifications-recovery-2.7.3.apk
          echo '2e78bd8b2e839a62712b9b686ef242d1b2623a6541f342cec285dca0e0da2084  base.apk' | sha256sum -c -
          curl -L --fail --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          echo 'eee4669a704a14e0623407e6701b0b91887e61e1e4049cb7a82833e14ae8b5fd  apktool.jar' | sha256sum -c -

      - name: Decode and patch Recall
        run: |
          java -jar apktool.jar d -f base.apk -o decoded
          sed -i 's/>Notifications Recovery</>Recall</g' decoded/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Make the recording preference default TRUE when absent, while preserving
          # an explicit user choice of FALSE. Patch only getBoolean's default arg.
          targets = [
              Path('decoded/smali/com/android/alftendev/services/NotificationListenerServiceImpl.smali'),
              Path('decoded/smali/com/android/alftendev/activities/home/SettingsActivity$a.smali'),
          ]
          key = 'isRecordNotificationEnabled'
          changed = 0
          for path in targets:
              lines = path.read_text().splitlines()
              i = 0
              while i < len(lines):
                  if key not in lines[i]:
                      i += 1
                      continue
                  for j in range(i + 1, min(i + 55, len(lines))):
                      if 'getBoolean(Ljava/lang/String;Z)Z' not in lines[j]:
                          continue
                      m = re.search(r'\{[^,]+,\s*[^,]+,\s*([^}]+)\}', lines[j])
                      if not m:
                          break
                      default_reg = m.group(1).strip()
                      # Force only this call's fallback to true.
                      lines.insert(j, f'    const/4 {default_reg}, 0x1')
                      # Restore the scratch/default register after move-result so later code
                      # retains its original false value semantics.
                      move_idx = None
                      for k in range(j + 2, min(j + 12, len(lines))):
                          if lines[k].lstrip().startswith('move-result'):
                              move_idx = k
                              break
                      if move_idx is None:
                          raise SystemExit(f'No move-result after recording getBoolean in {path}')
                      lines.insert(move_idx + 1, f'    const/4 {default_reg}, 0x0')
                      changed += 1
                      i = move_idx + 2
                      break
                  else:
                      i += 1
                      continue
                  i += 1
              path.write_text('\n'.join(lines) + '\n')

          if changed != 2:
              raise SystemExit(f'Expected exactly 2 recording-default reads, patched {changed}')

          # Android 11+: accept either strong biometric OR device credential
          # (PIN/password/pattern): BIOMETRIC_STRONG (0x000F) | DEVICE_CREDENTIAL (0x8000).
          auth = Path('decoded/smali/y5/d.smali')
          text = auth.read_text()
          old = '    const/16 v4, 0xf\n'
          new = '    const v4, 0x800f\n'
          if old not in text:
              raise SystemExit('Could not find biometric-only authenticator mask')
          text = text.replace(old, new, 1)
          auth.write_text(text)
          PY

          grep -q '>Recall<' decoded/res/values/strings.xml
          grep -q 'const v4, 0x800f' decoded/smali/y5/d.smali
          grep -q 'isRecordNotificationEnabled' decoded/smali/com/android/alftendev/services/NotificationListenerServiceImpl.smali

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o Recall-v1.0.1-unsigned.apk

      - name: Align, sign and verify
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 Recall-v1.0.1-unsigned.apk Recall-v1.0.1-aligned.apk
          keytool -genkeypair -v -keystore recall-v101.jks -storepass recallbuild -keypass recallbuild -alias recall -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Recall v1.0.1, OU=Android, O=PCG, L=Owosso, ST=Michigan, C=US'
          "$BUILD_TOOLS/apksigner" sign --ks recall-v101.jks --ks-pass pass:recallbuild --key-pass pass:recallbuild --out Recall-v1.0.1.apk Recall-v1.0.1-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Recall-v1.0.1.apk
          "$BUILD_TOOLS/aapt2" dump badging Recall-v1.0.1.apk | head -12
          sha256sum Recall-v1.0.1.apk > Recall-v1.0.1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Recall-v1.0.1-APK
          path: |
            Recall-v1.0.1.apk
            Recall-v1.0.1.sha256
          if-no-files-found: error
          retention-days: 30
