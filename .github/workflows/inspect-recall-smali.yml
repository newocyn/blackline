name: Inspect Recall compiled methods

on:
  push:
    branches: ["agent/recall-v1"]
    paths:
      - ".github/workflows/inspect-recall-smali.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified APK and apktool
        run: |
          curl -L --fail --retry 3 -o base.apk https://github.com/Alfio010/notification-listener-android/releases/download/v2.7.3/notifications-recovery-2.7.3.apk
          echo '2e78bd8b2e839a62712b9b686ef242d1b2623a6541f342cec285dca0e0da2084  base.apk' | sha256sum -c -
          curl -L --fail --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          echo 'eee4669a704a14e0623407e6701b0b91887e61e1e4049cb7a82833e14ae8b5fd  apktool.jar' | sha256sum -c -
      - name: Decode and locate target bytecode
        run: |
          java -jar apktool.jar d -f base.apk -o decoded >/dev/null
          echo '===== Notification listener recording check ====='
          sed -n '485,540p' decoded/smali/com/android/alftendev/services/NotificationListenerServiceImpl.smali
          echo '===== Auth setting region ====='
          grep -n -B40 -A100 'isAuthEnabled' decoded/smali/com/android/alftendev/activities/home/SettingsActivity\$a.smali | head -260 || true
          echo '===== Candidate auth helper resource references ====='
          grep -R -n -B35 -A80 '0x7f110017\|0x7f110018\|0x7f110019\|0x7f11001a' decoded/smali* | head -500 || true
