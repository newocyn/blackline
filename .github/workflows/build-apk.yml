name: Build PCG Object Recognizer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PCG-Object-Recognizer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCG-Object-Recognizer-APK
          path: PCG-Object-Recognizer.apk
          if-no-files-found: error
