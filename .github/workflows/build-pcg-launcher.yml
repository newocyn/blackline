name: Build PCG Launcher APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "pcg_launcher/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-pcg-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build launcher debug APK
        run: gradle :pcg_launcher:assembleDebug
      - name: Rename APK
        run: cp pcg_launcher/build/outputs/apk/debug/pcg_launcher-debug.apk PCG-Launcher-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCG-Launcher-APK
          path: PCG-Launcher-v1.1.apk
          if-no-files-found: error
