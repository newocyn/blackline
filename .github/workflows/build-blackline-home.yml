name: Build BLACKLINE Home APK

on:
  push:
    branches: [ "agent/blackline-home" ]
    paths:
      - "blackline_home/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-blackline-home.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build BLACKLINE Home debug APK
        run: gradle :blackline_home:assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cp blackline_home/build/outputs/apk/debug/blackline_home-debug.apk BLACKLINE-Home-v0.2.0.apk
          sha256sum BLACKLINE-Home-v0.2.0.apk > BLACKLINE-Home-v0.2.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKLINE-Home-v0.2.0
          path: |
            BLACKLINE-Home-v0.2.0.apk
            BLACKLINE-Home-v0.2.0.sha256
          if-no-files-found: error
